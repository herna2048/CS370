<!DOCTYPE html>
<html lang = "en"> <!--sets primary language to english-->
<html> 

<!--Head section of the HTML file-->
    <head>
        <meta charset="UTF-8"> <!--uses this coding standard gor global text usuage-->
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--adjusts layout and layotu sizing-->
        <title> CougarSequencer - Song Manager</title>
        <link rel="icon" type="image/png" href="../../images/Sequencer.png">
        <!--this section will be used for customization-->
        <link rel="stylesheet" href="../../cssFiles/style.css">

<!-- Body section of the HTML file-->
    <body>
        <h1> Song Manager </h1>
        <h2 id="userGreeting"></h2>
        <h4> Edit, Delete or Create Songs here! </h4>
        <hr>

        <button id = "backBtn"
            class="sendBtn"
            type = "button"
            aria-label = "Sign Out"
            title = "Sign Out">
            <!--This is for the icon-->
            <svg xmlns = "http://www.w3.org/2000/svg"
                width = "24"
                height = "24"
                viewBox = "0 0 24 24"
                fill = "none"
                stroke = "currentColor"
                stroke-width = "2"
                stroke-linecap = "round"
                stroke-linejoin= "round">
            
                <path d = "M9 21H5a2 2 0 0 1-2-2V5 a2 2 0 0 1 2-2h4"/>

                <polyline points = "16 17 21 12 16 7"/>

                <line x1 ="21" y1="12" x2="9" y2="12"/>
            </svg>    
        </button>

    <div class = "tool-bar">
            <!-- create song button -->
            <button
            id = "createSong"
            onclick = "location.href=''"
            aria-label = "Create Song Button"
            title = "Create Song"
            style="background-color: hsl(110, 86%, 30%);">
            Create Song + 
            </button>

            <!-- Song Boxes-->
            <div class = "songBox" id = "song1">
                <iframe src = "" width = "100%" height = "200"></iframe>
                <h2> Song 1 </h2>
                <hr>

                <button
                    id = "selectSong"
                    onclick = "window.location.replace('accountCreateSong.html')"
                    aria-label = "Select Song Button"
                    title = "Select Song"> 
                    Select 
                </button>

                <button 
                    id="deleteBtn"
                    onclick = "window.location.replace('')"
                    aria-label = "Delete Song Button"
                    title = "Delete Song">
                    Delete 
                </button>

                 <!--This is for export project-->
                <button 
                    id = "exportProject"
                    class="imageBtn"
                    type = "button"
                    aria-label = "Export Project"
                    title = "Export Project">
                    <!--This is for the icon-->
                    <svg xmlns = "http://www.w3.org/2000/svg"
                        width = "24"
                        height = "24"
                        viewBox = "0 0 24 24"
                        fill = "none"
                        stroke = "currentColor"
                        stroke-width = "2"
                        stroke-linecap = "round"
                        stroke-linejoin = "round">
                        
                        <path d = "M21 15v4a2 2 0 0 1-2 2H5 a2 2 0 0 1-2-2v-4"/>
                        
                        <polyline points = "7 10 12 15 17 10"/>

                        <line x1="12" y1="15" x2 ="12" y2 = "3"/> 
                    </svg>    
                </button>
                
            </div> 
    </div>

        <script src="../../jsFiles/account/logOut.js"></script>
        <script src="../../jsFiles/getUserinfo.js"></script>
    </body>
</html>
