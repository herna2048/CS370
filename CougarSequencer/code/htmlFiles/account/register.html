<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CougarSequencer - Register</title>
  <link rel="icon" type="image/png" href="../../images/Sequencer.png">
  <link rel ="stylesheet" href="../../cssFiles/style.css">
</head>
<body>

<!-- The register button -->
<div class="register">
  <h3>Please Create a New Username and Password</h3>
  <div class="form-row">
    <input type="text" class="input" id="username" placeholder="username" /><br>
    <input type="text" class="input" id="password" placeholder="password" /><br>
    <button id="registertBtn" class="sendBtn" type="submit">Send</button>
  </div>
  <div id="registerOutput" class="registerOutput"></div>
  <a href="login.html" id="href">  <!-- To go to the login.html file via hyperlink -->
    <h4>If you already have an account</h4>
  </a>
</div>

<!--This is to go back-->
<button id = "backBtn"
        class="sendBtn"
        onclick = "window.location.replace('../homePage.html')"
        type = "button"
        aria-label = "Welcome Page Button"
        title = "Welcome Page">
        Back</button>

  <!-- To involve the JS code for gathering the data that the user submits via button -->
  <script src="../../jsFiles/account/register.js"></script>
</body>
</html>
