<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CougarSequencer - Login</title>
  <link rel="icon" type="image/png" href="../images/Sequencer.png">
  <link rel ="stylesheet" href="../cssFiles/style.css">
</head>
<body>
   <!-- The greeter button -->
  <div class="greeter">
    <div id="title">CougarSequencer</div>
    <button id="greeterBtn" class="greeterBtn" type="submit">Welcome!</button>
    <div id="greeterOutput" class="greeterOutput"></div>
  </div>

    <!-- The guest button -->
  <button 
          class = "sendBtn"
          id = "guestBtn"
          onclick = "window.location.replace('guest/guestCreateSong.html')"
          type = "button"
          aria-label = "Guest Button"
          title = "Guest">
          Guest</button>

   <!-- The login button -->
  <button 
          id = "loginBtn"
          class="sendBtn"
          onclick = "window.location.replace('account/login.html')"
          type = "button"
          aria-label = "Login Button"
          title = "Login">
          Login</button>

  <!-- To involve the JS code for gathering the data that the user submits via button -->
  <script src="../jsFiles/greeter.js"></script>
</body>
</html>
