<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CougarSequencer - Welcome</title>
  <link rel="icon" type="image/png" href="../images/Sequencer.png">
  <link rel ="stylesheet" href="../cssFiles/style.css">
</head>
<body class = "welcome-page">
  <!--Navigation Bar-->
    <nav class="welcome-navbar">
      <div class = "logo">CougarSequencer</div>

      <a id="greeterBtn" class="greeterBtn">Welcome</a>
    </nav>

    <!--Main Welcome Section-->
    <main class="welcome-content">
      <h1>Where Story Meets Song.</h1>

      <p id="greeter">
        Every song has a story, let's start writing yours.
      </p>

      <!--Account Options -->
      <div class ="welcome-buttons">

        <button
          class="create-account-btn"
          onclick="window.location.href='account/register.html'"
          type="button">
          Create Account
        </button>

        <button
          class="sign-in-btn"
          onclick="window.location.href='account/login.html'"
          type="button">
          Sign In
        </button>

      </div>
      <a class="guest-link" href="guest/guestCreateSong.html">
        Continue as Guest
      </a>

    </main>
</body>
</html>
<!-- To involve the JS code for gathering the data that the user submits via button -->
