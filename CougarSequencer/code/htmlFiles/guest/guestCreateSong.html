<!DOCTYPE html>
<html lang="en"> <!--sets English as the primary languague-->
<head>
    <meta charset="UTF-8"> <!--uses this coding standard gor global text usuage-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--adjusts layout and layotu sizing-->
    <title> CougarSequencer - Play</title>
    <link rel="icon" type="image/png" href="../../images/Sequencer.png">
    <!--this section will be used for customization-->

<body>
    <!--This is to go back-->
    <button id = "backBtn"
          class="sendBtn"
          onclick = "window.location.replace('../homePage.html')"
          type = "button"
          aria-label = "Welcome Page Button"
          title = "Welcome Page">
          Back</button>

    <div class = "tool-bar">
        <button 
                id = "pianoBtn"
                class="imageBtn"
                onclick = "location.href='../instruments/pianoGrid.html'"
                type = "button"
                aria-label = "Piano Button"
                title = "Piano">
                🎹</button>
        <button 
                id = "bassBtn"
                class="imageBtn"
                onclick = "location.href='../instruments/bassGrid.html'"
                type = "button"
                aria-label = "Bass Button"
                title = "Bass">
                🎸</button>
        <button 
                id = "drumsBtn"
                class="imageBtn"
                onclick = "location.href='../instruments/drumsGrid.html'"
                type = "button"
                aria-label = "Drums Button"
                title = "Drums">
                🥁</button>
        <button
            id = "exportProject"
            class="imageBtn"
            type = "button"

            title = "Export Project">

            <svg xmlns = "http://www.w3.org/2000/svg"
                width = "24"
                height = "24"
                viewBox = "0 0 24 24"
                fill = "none"

                stroke-width = "2"
                stroke-linecap = "round"

                <path d = "M21 15v4a2 2 0 0 1-2 2H5 a2 2 0 0 1-2-2v-4"/>
                
                <polyline points = "7 10 12 15 17 10"/>
