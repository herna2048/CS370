<!DOCTYPE html>
<html lang="en"> <!--sets English as the primary languague-->
<head>
    <meta charset="UTF-8"> <!--uses this coding standard gor global text usuage-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--adjusts layout and layotu sizing-->
    <title> CougarSequencer - Drums</title>
    <link rel="icon" type="image/png" href="../../images/Sequencer.png">
    <!--this section will be used for customization-->
    <link rel="stylesheet" href="../../cssFiles/grid.css">
    <link rel="stylesheet" href="../../cssFiles/style.css">
    <script src="https://unpkg.com/tone"></script>
</head>
<body>
     <div class="sequencer-container">
        <div class= "sequencer-layout-wrapper">
            <div class="top-controls-panel">
                <!--This is to go back--> 
                <button class = "sendBtn" id = "backBtn" onclick = "history.back()" type = "button" aria-label = "Back Button" title = "Back"> Back</button>
                <div class ="playback-cluster">
     <!--This is to play-->
                    <button class = "btn" id = "playBtn" type = "button" aria-label = "Play Button" title = "Play"> ▶</button>
    <!--This is to pause-->
                    <button class = "btn" id = "pauseBtn" type = "button" aria-label = "Pause Button" title = "Pause" style="display: none;"> ⏸</button>
                    <input type="text" class="input" id="bpmNum"/>
                    <!-- The volume slider -->
                    <div class = "volumeSlider"> 
                        <input type="range" id="volume" min="0" max="100" value="70"> 
                        <label for="volume">Volume</label>
                    </div>
                </div>

           </div>

        <h1 id="sequencer-title" class="sequencer-title">Drums</h1>
        <div class="sequencer-layout">
            <div class="labels-container" id="labelsColumn"></div>
            <div class="grid-container" id="sequencerGrid">
                <div class = "tempoMeter" id="tempoMeter"></div>
            </div>
            <div id="display">
                00:00
            </div>
        </div>
        
    </div>

    <script src="../../jsFiles/getUserinfo.js"></script>
    <script src="../../jsFiles/grid.js"defer>
        window.onload = initializePage
    </script>
    </script>
    <script src="../../jsFiles/play.js"defer>
        window.onload = initializePage
    </script>
    <script src="../../jsFiles/stopWatch.js"></script>
</body>
</html>
