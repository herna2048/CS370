<!DOCTYPE html>
<html lang="en"> <!--sets English as the primary languague-->
<head>
    <meta charset="UTF-8"> <!--uses this coding standard gor global text usuage-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--adjusts layout and layotu sizing-->
    <title> CougarSequencer - Grid</title>
    <!--this section will be used for customization-->
    <link rel="stylesheet" href="../cssFiles/grid.css">
</head>
<body>
   
    <div class="sequencer-container">
       
        <div class = "tool-bar">
           
             <a href="login.html" 
                class = "toolbtn"
                aria-label = "signOut"
                title = "signOut">

                <svg xmlns = "http://www.w3.org/2000/svg"
                    width= "24"
                    height = "24"
                    viewBox = "0 0 24 24"
                    fill = "none"
                    stroke = "currentColor"
                    stroke-width = "2"
                    stroke-linecap = "round"
                    stroke-linejoin= "round">
                
                    <path d = "M9 21H5a2 2 0 0 1-2-2V5 a2 2 0 0 1 2-2h4"/>

                    <polyline points = "16 17 21 12 16 7"/>

                    <line x1 ="21" y1="12" x2="9" y2="12"/>
                </svg>
            </a>
            
            <button class = "toolbtn playButton">▶</button>
            <button class = "toolbtn startButton">↺</button>
            <button class = "toolbtn"
                    id ="exportProj"
                    type="button"
                    aria-label="Export Project"
                    title = "Export Project">

                <svg xmlns = "http://www.w3.org/2000/svg"
                     width = "24"
                     height = "24"
                     viewBox = "0 0 24 24"
                     fill = "none"
                     stroke = "currentColor"
                     stroke-width = "2"
                     stroke-linecap = "round"
                     stroke-linejoin = "round">
                    
                     <path d = "M21 15v4a2 2 0 0 1-2 2H5 a2 2 0 0 1-2-2v-4"/>
                     
                     <polyline points = "7 10 12 15 17 10"/>

                     <line x1="12" y1="15" x2 ="12" y2 = "3"/> 
                    </svg>    
            </button>

            <div class = "volumeSlider">
                <label for="volume">Volume</label>
            <input
                type="range"
                id="volume"
                min="0"
                max="100"
                value="70"
                >
            </div>
        </div>

        <h1 class="sequencer-title">Piano</h1>
        <div class="grid-container" id="sequencerGrid"></div>
    </div>
    

    <script src="../jsFiles/grid.js">
    // Runs automatically when the window loads
     window.onload = initializePage;
    </script>
    
</html>
