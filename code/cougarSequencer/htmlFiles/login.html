<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CougarSequencer</title>
  <link rel ="stylesheet" href="../cssFiles/style.css">
</head>
<body>
  <h1>CougarSequencer</h1>

   <!-- The greeter button -->
  <div class="card">
  <button id="greeterBtn">Welcome!</button>
  <div id="greeterOutput" class="result-box"></div>
</div>

  <!-- The login button -->
<div class="card">
  <h3>Please put in your username and password</h3>
  <div class="form-row">
    <input type="text" id="username" placeholder="username" /><br>
    <input type="text" id="password" placeholder="password" /><br>
    <button id="loginBtn">Send</button>
  </div>
  <div id="loginOutput" class="result-box"></div>
  <a href="register.html"> <!-- To go to the register.html file via hyperlink -->
    <h4>If you don't have an account</h4>
  </a>
</div>

  <!-- To involve the JS code for gathering the data that the user submits via button -->
  <script src="../jsFiles/greeting.js"></script>
  <script src="../jsFiles/login.js"></script>
</body>
</html>
