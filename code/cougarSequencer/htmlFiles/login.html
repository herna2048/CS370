<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CougarSequencer</title>
  <link rel ="stylesheet" href="../cssFiles/login.css">
</head>
<body>
   <!-- The greeter button -->
  <div class="greeter">
    <div id="title">CougarSequencer</div>
    <button id="greeterBtn" class="greeterBtn" type="submit">Welcome!</button>
    <div id="greeterOutput" class="greeterOutput"></div>
  </div>

  <!-- The login button -->
<div class="login">
  <h3>Please put in your username and password</h3>
  <div class="form-row">
    <input type="text" id="username" placeholder="username" /><br>
    <input type="text" id="password" placeholder="password" /><br>
    <button id="loginBtn" class="loginBtn" type="submit">Send</button>
  </div>
  <div id="loginOutput" class="loginOutput"></div>
  <a href="register.html" id="href"> <!-- To go to the register.html file via hyperlink -->
    <h4>If you don't have an account</h4>
  </a>
</div>

  <!-- To involve the JS code for gathering the data that the user submits via button -->
  <script src="../jsFiles/greeter.js"></script>
  <script src="../jsFiles/login.js"></script>
</body>
</html>
